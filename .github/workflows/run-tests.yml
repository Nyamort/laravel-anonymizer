name: run-tests

on:
  push:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'
      - 'integration/production/composer.json'
      - 'README.md'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'
      - 'integration/production/composer.json'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Compatibility checks deliberately exercise legacy/minimum dependencies with advisories.
    # This exception applies only to the isolated test job, never to consumer configuration.
    env:
      COMPOSER_NO_SECURITY_BLOCKING: ${{ (matrix.laravel == '11.*' || matrix.stability == 'prefer-lowest') && '1' || '0' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.4', '8.5']
        laravel: ['13.*', '12.*', '11.*']
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: '13.*'
            testbench: '11.*'
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '11.*'
            testbench: '9.*'

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Execute tests
        run: composer test -- --ci

  production:
    # The consumer is a throwaway SQLite smoke test; Laravel 11 is a legacy compatibility target.
    env:
      COMPOSER_NO_SECURITY_BLOCKING: ${{ matrix.laravel == '11.*' && '1' || '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        laravel: ['13.*', '12.*', '11.*']

    name: Production P${{ matrix.php }} - L${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Install consumer without development dependencies
        run: |
          composer require --working-dir=integration/production "laravel/framework:${{ matrix.laravel }}" --no-update --no-interaction
          composer install --working-dir=integration/production --no-dev --prefer-dist --no-interaction

      - name: Verify production anonymization
        run: php integration/production/smoke.php
